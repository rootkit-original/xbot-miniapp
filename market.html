<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBot Análise de Mercado</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Análise de Mercado</h1>
            <p>Tendências e indicadores</p>
        </header>

        <div class="content">
            <div class="market-summary">
                <h3>Resumo do Mercado</h3>
                <div class="market-stats">
                    <div class="stat-card">
                        <h4>Capitalização</h4>
                        <p>$2.35T</p>
                        <p class="change positive">+1.2%</p>
                    </div>
                    <div class="stat-card">
                        <h4>Domínio BTC</h4>
                        <p>48.2%</p>
                        <p class="change negative">-0.5%</p>
                    </div>
                    <div class="stat-card">
                        <h4>Medo/Ganância</h4>
                        <p>37 - Medo</p>
                    </div>
                </div>
            </div>

            <div class="market-chart">
                <h3>Tendências de Mercado</h3>
                <canvas id="marketTrendChart"></canvas>
            </div>

            <div class="top-movers">
                <h3>Top Moedas</h3>
                <div class="tabs">
                    <button class="tab-button active" data-tab="gainers">Em Alta</button>
                    <button class="tab-button" data-tab="losers">Em Queda</button>
                    <button class="tab-button" data-tab="volume">Volume</button>
                </div>
                
                <div class="tab-content" id="gainers">
                    <table>
                        <thead>
                            <tr>
                                <th>Moeda</th>
                                <th>Preço</th>
                                <th>24h</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>AVAX</td>
                                <td>$35.45</td>
                                <td class="positive">+15.8%</td>
                            </tr>
                            <tr>
                                <td>DOT</td>
                                <td>$7.23</td>
                                <td class="positive">+12.3%</td>
                            </tr>
                            <tr>
                                <td>MATIC</td>
                                <td>$0.85</td>
                                <td class="positive">+9.7%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer>
            <button id="backButton" class="button">Voltar</button>
        </footer>
    </div>

    <script src="js/app.js"></script>
    <script src="js/market.js"></script>
</body>
</html>
