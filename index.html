<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>XBot Trading</h1>
            <p>Assistente de Trading para Criptomoedas</p>
        </header>

        <div class="card-container">
            <div class="card" onclick="location.href='dashboard.html'">
                <div class="card-icon">📊</div>
                <h2>Dashboard</h2>
                <p>Visualize gráficos avançados e estatísticas de trading</p>
            </div>

            <div class="card" onclick="location.href='portfolio.html'">
                <div class="card-icon">💼</div>
                <h2>Portfolio</h2>
                <p>Gerencie seu portfolio e acompanhe o desempenho</p>
            </div>

            <div class="card" onclick="location.href='market.html'">
                <div class="card-icon">📈</div>
                <h2>Análise de Mercado</h2>
                <p>Análise detalhada das condições de mercado</p>
            </div>
        </div>

        <footer>
            <button id="backButton" class="button">Voltar ao Bot</button>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
