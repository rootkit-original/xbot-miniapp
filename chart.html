<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBot Gráfico</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@2.0.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.0.0"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="symbol-title">Carregando...</h1>
        </header>

        <div class="content">
            <div class="price-info">
                <div class="current-price">
                    <span id="current-price">$0.00</span>
                    <span id="price-change" class="positive">+0.00%</span>
                </div>
            </div>

            <div class="chart-controls">
                <button class="time-button active" data-period="1h">1H</button>
                <button class="time-button" data-period="4h">4H</button>
                <button class="time-button" data-period="1d">1D</button>
                <button class="time-button" data-period="1w">1W</button>
                <button class="time-button" data-period="1m">1M</button>
            </div>

            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>

            <div class="coin-details">
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-label">Vol. 24h</span>
                        <span class="stat-value" id="volume">$0.00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Volatilidade</span>
                        <span class="stat-value" id="volatility">0.0%</span>
                    </div>
                </div>
                
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-label">Máxima 24h</span>
                        <span class="stat-value" id="high">$0.00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Mínima 24h</span>
                        <span class="stat-value" id="low">$0.00</span>
                    </div>
                </div>
            </div>

            <div class="indicators-section">
                <h3>Indicadores Técnicos</h3>
                <table class="indicators-table">
                    <tr>
                        <td>RSI (14)</td>
                        <td id="rsi">57.8</td>
                        <td>Neutro</td>
                    </tr>
                    <tr>
                        <td>MACD</td>
                        <td id="macd">0.35/0.22</td>
                        <td>Positivo</td>
                    </tr>
                    <tr>
                        <td>Estocástico</td>
                        <td id="stoch">65.2</td>
                        <td>Neutro</td>
                    </tr>
                </table>
            </div>
        </div>

        <footer>
            <button id="backButton" class="button">Voltar</button>
            <button id="alertButton" class="button alert-btn">Criar Alerta</button>
        </footer>
    </div>

    <script src="js/app.js"></script>
    <script src="js/chart.js"></script>
</body>
</html>
